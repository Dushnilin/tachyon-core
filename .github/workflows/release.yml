name: Release

# Sources live in the private repo; this workflow builds them here and
# publishes the release to this (public) repo. The tag is the only thing
# that produces a release, and it has to be the workspace version:
# `Cargo.toml` is the one place the version lives, so a tag that disagrees
# with it is a release whose binary lies about what it is.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must match Cargo.toml in tachyon-core-src)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SIZE_BUDGET: 12582912

jobs:
  check-version:
    name: tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.tag }}
      - name: Read the version the binaries will report
        id: version
        run: |
          in_cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${{ inputs.tag }}"
          echo "cargo=$in_cargo tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$in_cargo" != "${tag#v}" ]; then
            echo "::error::Cargo.toml says $in_cargo, the release is tagged $tag"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt router musl targets (static binary)
          - name: x86_64
            target: x86_64-unknown-linux-musl
            use_musl_lld: true
            budget: 14680064
          - name: aarch64
            target: aarch64-unknown-linux-musl
            budget: 14680064
          - name: armv7
            target: armv7-unknown-linux-musleabihf
            use_musl_lld: true
            budget: 14680064
          - name: armv6
            target: arm-unknown-linux-musleabi
            use_musl_lld: true
            budget: 14680064
          - name: riscv64
            target: riscv64gc-unknown-linux-musl
            use_musl_lld: true
            budget: 14680064
          # mipsel and mips have no prebuilt std: tier-3 targets that need
          # the standard library built from source via nightly + build-std
          - name: mipsel
            target: mipsel-unknown-linux-musl
            build-std: true
            use_musl_lld: true
            # ~350 KiB of .pdr descriptors survive strip, and the gcc-linked
            # build has no --icf: 12 MiB is unreachable on MIPS.
            budget: 16777216
          - name: mips
            target: mips-unknown-linux-musl
            build-std: true
            use_musl_lld: true
            budget: 16777216
          # Desktop & Server targets
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            budget: 16777216
          - name: windows-amd64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            is_windows: true
            budget: 20971520
          - name: darwin-amd64
            target: x86_64-apple-darwin
            os: macos-latest
            budget: 16777216
          - name: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            budget: 16777216
          # Android NDK targets (Bionic PIE binary, API 24+, 16 KB page alignment)
          - name: aarch64-linux-android
            target: aarch64-linux-android
            ndk_clang: aarch64-linux-android24-clang
            budget: 16777216
          - name: x86_64-linux-android
            target: x86_64-linux-android
            ndk_clang: x86_64-linux-android24-clang
            budget: 16777216
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.tag }}

      - name: Install musl-tools (x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      # rust-lld's self-contained CRT only carries start files for the targets
      # rustup distributes a std for; the MIPS targets are tier-3 and have
      # none, so `link-self-contained=yes` hands lld bare `Scrt1.o` / `-lc`
      # names it cannot resolve. Build a real musl and link through the apt
      # cross gcc driver with `-B` pointed at the musl lib dir. (musl.cc, the
      # usual prebuilt toolchain for this, times out from the runner network.)
      - name: MIPS musl toolchain (mipsel)
        if: matrix.target == 'mipsel-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu
          curl -fsSL --retry 3 -o /tmp/musl.tar.gz \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz
          tar -xzf /tmp/musl.tar.gz -C /tmp
          (cd /tmp/musl-1.2.5 && \
            CROSS_COMPILE=mipsel-linux-gnu- CFLAGS="-msoft-float" ./configure --prefix=/opt/mipsel-musl && \
            make -j"$(nproc)" && sudo make install)
          echo 'int _dl_find_object(void *pc, void *dlfo) { return -1; }' > /tmp/dlfo.c
          mipsel-linux-gnu-gcc -msoft-float -c /tmp/dlfo.c -o /tmp/dlfo.o
          rm -rf /tmp/eh-mipsel && mkdir -p /tmp/eh-mipsel
          (cd /tmp/eh-mipsel && mipsel-linux-gnu-ar x "$(mipsel-linux-gnu-gcc -msoft-float -print-file-name=libgcc_eh.a)")
          sudo mipsel-linux-gnu-ar crs /opt/mipsel-musl/lib/libunwind.a /tmp/eh-mipsel/*.o /tmp/dlfo.o
          {
            echo "CC_mipsel_unknown_linux_musl=mipsel-linux-gnu-gcc"
            echo "CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER=mipsel-linux-gnu-gcc"
            # Env RUSTFLAGS wins over the .cargo/config.toml array, so the
            # array is repeated here minus everything that names lld: the
            # driver is GNU ld now and it rejects `--icf=safe`.
            # +soft-float and -msoft-float are mandatory: OpenWrt MIPS routers
            # (e.g. MT7621, MT7628) have no hardware FPU and no kernel FPU
            # emulator, so any FPU opcode triggers SIGILL (status 252).
            echo "RUSTFLAGS=-C target-feature=+crt-static,+soft-float -C link-self-contained=no -C force-unwind-tables=no -C panic=abort -C link-arg=-msoft-float -C link-arg=-B/opt/mipsel-musl/lib -C link-arg=-L/opt/mipsel-musl/lib -C link-arg=-static -C link-arg=-z -C link-arg=noseparate-code -C link-arg=-z -C link-arg=norelro"
          } >> "$GITHUB_ENV"

      - name: MIPS musl toolchain (mips)
        if: matrix.target == 'mips-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu
          curl -fsSL --retry 3 -o /tmp/musl.tar.gz \
            https://musl.libc.org/releases/musl-1.2.5.tar.gz
          tar -xzf /tmp/musl.tar.gz -C /tmp
          (cd /tmp/musl-1.2.5 && \
            CROSS_COMPILE=mips-linux-gnu- CFLAGS="-msoft-float" ./configure --prefix=/opt/mips-musl && \
            make -j"$(nproc)" && sudo make install)
          echo 'int _dl_find_object(void *pc, void *dlfo) { return -1; }' > /tmp/dlfo.c
          mips-linux-gnu-gcc -msoft-float -c /tmp/dlfo.c -o /tmp/dlfo.o
          rm -rf /tmp/eh-mips && mkdir -p /tmp/eh-mips
          (cd /tmp/eh-mips && mips-linux-gnu-ar x "$(mips-linux-gnu-gcc -msoft-float -print-file-name=libgcc_eh.a)")
          sudo mips-linux-gnu-ar crs /opt/mips-musl/lib/libunwind.a /tmp/eh-mips/*.o /tmp/dlfo.o
          {
            echo "CC_mips_unknown_linux_musl=mips-linux-gnu-gcc"
            echo "CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER=mips-linux-gnu-gcc"
            echo "RUSTFLAGS=-C target-feature=+crt-static,+soft-float -C link-self-contained=no -C force-unwind-tables=no -C panic=abort -C link-arg=-msoft-float -C link-arg=-B/opt/mips-musl/lib -C link-arg=-L/opt/mips-musl/lib -C link-arg=-static -C link-arg=-z -C link-arg=noseparate-code -C link-arg=-z -C link-arg=norelro"
          } >> "$GITHUB_ENV"

      - name: Toolchain (prebuilt std)
        if: ${{ !matrix.build-std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Toolchain (std from source)
        if: ${{ matrix.build-std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      # All musl targets are explicitly configured in .cargo/config.toml with linker = "rust-lld"
      # and target-specific rustflags. We do not set RUSTFLAGS in env to avoid wiping those flags.

      # Windows runner uses MSVC's link.exe from PATH
      - name: Windows linker override
        if: ${{ matrix.is_windows }}
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=link.exe" >> "$GITHUB_ENV"

      # Android NDK targets link against Bionic libc/libm/libdl using the preinstalled
      # NDK clang wrapper on ubuntu-latest. Set target-specific LINKER env vars (not
      # RUSTFLAGS, which would override the ARMv8 crypto cfgs in .cargo/config.toml).
      - name: Android NDK toolchain
        if: ${{ matrix.ndk_clang != '' }}
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          bin_dir="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$bin_dir/${{ matrix.ndk_clang }}"
          test -x "$clang"
          triple_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          triple_lower=$(echo "${{ matrix.target }}" | tr '-' '_')
          {
            echo "CARGO_TARGET_${triple_upper}_LINKER=$clang"
            echo "CC_${triple_lower}=$clang"
            echo "AR_${triple_lower}=$bin_dir/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.build-std }}" ]; then
            cargo build --workspace --release --target ${{ matrix.target }} \
              -Z build-std=std,panic_abort
          else
            cargo build --workspace --release --target ${{ matrix.target }}
          fi

      - name: Size budget
        shell: bash
        run: |
          if [ "${{ matrix.is_windows }}" = "true" ]; then
            bin="target/${{ matrix.target }}/release/tachyon-core.exe"
          else
            bin="target/${{ matrix.target }}/release/tachyon-core"
          fi
          size=$(wc -c < "$bin" | tr -d ' ')
          budget="${{ matrix.budget || env.SIZE_BUDGET }}"
          echo "${{ matrix.name }}: $size bytes, budget $budget"
          test "$size" -le "$budget"

      - name: The binary is for this architecture
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/tachyon-core"

      - name: Pack (Unix)
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          ver="${{ inputs.tag }}"
          name="tachyon-core-${{ matrix.name }}-${ver}"
          bin="target/${{ matrix.target }}/release/tachyon-core"
          cp "$bin" "./${name}"
          sha256sum "./${name}" > "./${name}.sha256"
          tar -czf "${name}.tar.gz" "./${name}"

      - name: Pack (Windows)
        if: ${{ matrix.is_windows }}
        shell: bash
        run: |
          ver="${{ inputs.tag }}"
          name="tachyon-core-${{ matrix.name }}-${ver}"
          bin="target/${{ matrix.target }}/release/tachyon-core.exe"
          cp "$bin" "./tachyon-core.exe"
          sha256sum "./tachyon-core.exe" > "./${name}.sha256"
          powershell -Command "Compress-Archive -Path './tachyon-core.exe' -DestinationPath '${name}.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            tachyon-core-${{ matrix.name }}-*.tar.gz
            tachyon-core-${{ matrix.name }}-*.zip
            tachyon-core-${{ matrix.name }}-*.sha256
          if-no-files-found: warn

  release:
    name: attach to the release
    needs: [check-version, build]
    if: always() && needs.check-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLIC_REPO: Dushnilin/tachyon-core
    steps:
      # Notes and the previous tag come from the source repo: the public tree
      # is frozen at the last pre-split release and its CHANGELOG lags behind.
      - uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: One checksum file for everything
        run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
      - name: The notes for this version, not the whole file
        run: |
          tag="${{ inputs.tag }}"
          ver="${tag#v}"
          awk -v want="## $ver" '
            /^## / { inside = ($0 == want) }
            inside
          ' CHANGELOG.md > section.md
          if ! grep -q '^## ' section.md; then
            echo "::error::CHANGELOG.md has no section for $ver"
            exit 1
          fi
          prev=$(git tag --sort=-v:refname | grep -v "^${tag}$" | head -n 1 || true)
          {
            echo "# ⚡ Tachyon Core v${ver}"
            echo ""
            echo "> **Независимое высокопроизводительное сетевое ядро для OpenWrt на чистом Rust**"
            echo ""
            echo "[![GitHub Release](https://img.shields.io/github/v/release/${PUBLIC_REPO}?color=6366F1)](https://github.com/${PUBLIC_REPO}/releases) [![RAM RSS](https://img.shields.io/badge/RAM_RSS-4.2_MiB_idle-10B981)](https://github.com/${PUBLIC_REPO}) [![Benchmarks](https://img.shields.io/badge/Benchmarks-36%2F39_Wins-10B981)](https://github.com/${PUBLIC_REPO}/blob/main/BENCHMARK.md) [![OpenWrt](https://img.shields.io/badge/OpenWrt-23.05_%7C_24.10_%7C_25.x-10B981)](https://openwrt.org/) [![Arch](https://img.shields.io/badge/Arch-aarch64%7C_arm%7C_mips%7C_x86--64-8B5CF6)](https://github.com/${PUBLIC_REPO}/releases/tag/${tag}) [![License](https://img.shields.io/badge/License-Proprietary-FF6B4A)](https://github.com/${PUBLIC_REPO}/blob/main/LICENSE)"
            echo ""
            echo "---"
            echo ""
            tail -n +2 section.md | sed 's/^### Исправления и улучшения$/---\n\n### 🌟 Ключевые нововведения и исправления/'
            echo ""
            echo "---"
            echo ""
            echo "### 📦 Контрольные суммы бинарников (SHA-256)"
            echo ""
            echo "\`\`\`text"
            cat artifacts/SHA256SUMS
            echo "\`\`\`"
            if [ -n "$prev" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${PUBLIC_REPO}/compare/${prev}...${tag}"
            fi
          } > notes.md
          cat notes.md

      - name: Sync docs, changelog & tag to this repository (${{ env.PUBLIC_REPO }})
        run: |
          tag="${{ inputs.tag }}"
          ver="${tag#v}"
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${PUBLIC_REPO}.git" /tmp/public-repo
          # Keep frozen historical source tree in public repo; update only public documentation, changelog, license & benchmark reports
          for item in README.md README.en.md CHANGELOG.md BENCHMARK.md BENCHMARK.html LICENSE assets docs; do
            if [ -e "$item" ]; then
              cp -a "$item" /tmp/public-repo/
            fi
          done
          cd /tmp/public-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "релиз ${tag} (обновление документации и списка изменений)"
          fi
          git tag -fa "${tag}" -m "Release ${tag}"
          git push origin main
          git push origin "${tag}" --force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "⚡ Tachyon Core ${{ inputs.tag }}"
          tag_name: ${{ inputs.tag }}
          body_path: notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false
