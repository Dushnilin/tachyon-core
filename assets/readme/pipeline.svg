<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="304" viewBox="0 0 1200 304"
     role="img" aria-labelledby="title desc">
  <title id="title">Архитектура конвейера обработки трафика tachyon-core</title>
  <desc id="desc">Четыре этапа прохождения трафика: приём и прозрачный перехват (TProxy, Redirect, TUN, 12 серверных протоколов), неразрушающий сниффер протоколов и Smart DNS, маршрутизатор по наборам .trs/.srs с контролем давления памяти, и исходящие туннели с адаптивной сегментацией.</desc>

  <rect width="1200" height="304" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="303" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="40" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="500">Конвейер обработки трафика tachyon-core · Zero-Copy Data Plane</text>
  <text x="32" y="64" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">От перехвата пакета в ядре Linux или TUN-интерфейсе до шифрованного туннеля без промежуточных копий и пауз GC</text>

  <!-- Step 1 (268px) -->
  <g transform="translate(32, 88)">
    <rect x="0" y="0" width="268" height="184" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="32" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 01 · Inbounds</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Приём и перехват</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">TProxy (IP_TRANSPARENT),</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Redirect NAT, Mixed, TUN</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Серверный стек (12 протоколов)</text>
    <text x="20" y="158" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">VLESS · Hy2 · TUIC · Naive · AWG</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="300" y1="180" x2="320" y2="180" stroke="#2e2e32" stroke-width="1"/>

  <!-- Step 2 (268px) -->
  <g transform="translate(320, 88)">
    <rect x="0" y="0" width="268" height="184" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="32" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 02 · Sniff &amp; DNS</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Инспекция и Smart DNS</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Извлечение TLS/QUIC SNI</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">и HTTP Host без потери байт</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Группы DNS и пул FakeIP</text>
    <text x="20" y="158" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">DoH3 · DoQ · DoH · 198.18.0.0/15</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="588" y1="180" x2="608" y2="180" stroke="#2e2e32" stroke-width="1"/>

  <!-- Step 3: Highlighted Moment (272px) -->
  <g transform="translate(608, 88)">
    <rect x="0" y="0" width="272" height="184" rx="12" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="20" y="32" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 03 · Router &amp; RAM</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Маршрутизация и splice</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Мгновенные списки .trs (mmap)</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">и .srs v5, CIDR, MAC/DHCP, UID</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Мониторинг давления памяти</text>
    <text x="20" y="158" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">4 тира ОЗУ · zero-copy splice</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="880" y1="180" x2="900" y2="180" stroke="#2e2e32" stroke-width="1"/>

  <!-- Step 4 (268px) -->
  <g transform="translate(900, 88)">
    <rect x="0" y="0" width="268" height="184" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="32" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500">Этап 04 · Outbounds</text>
    <text x="20" y="60" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Туннели и шейпинг</text>
    <text x="20" y="88" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">VLESS, REALITY (ML-KEM-768),</text>
    <text x="20" y="108" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">XHTTP, Hy2, TUIC v5, Naive UoT</text>
    <text x="20" y="136" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Туннели и L4/L7-сегментация</text>
    <text x="20" y="158" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">AWG 2/3 · MASQUE · Desync</text>
  </g>
</svg>
