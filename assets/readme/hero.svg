<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <title>tachyon-core - Rust Proxy Core for Routers</title>
  <defs>
    <!-- Background Space Gradients -->
    <radialGradient id="bg-space" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#090D16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="cyan-glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="25%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Holographic Title Gradient -->
    <linearGradient id="holo-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Miniature 3D Tachyon Brand Logo Symbol -->
    <g id="tachyon-mini-logo">
      <circle cx="10" cy="10" r="9" fill="#00F0FF" fill-opacity="0.12"/>
      <!-- Left 3D Obsidian Facet -->
      <polygon points="6,3 2,10 6,17 6,10" fill="#1E293B" stroke="#38BDF8" stroke-width="0.6"/>
      <polygon points="6,3 6,10 9,10" fill="#334155" stroke="#00F0FF" stroke-width="0.6"/>
      <polygon points="2,10 6,17 6,10" fill="#0F172A" stroke="#1E293B" stroke-width="0.6"/>
      <polygon points="9,10 6,17 6,10" fill="#0284C7" stroke="#00F0FF" stroke-width="0.6"/>
      <!-- Right 3D Obsidian Facet -->
      <polygon points="14,3 18,10 14,17 14,10" fill="#1E293B" stroke="#818CF8" stroke-width="0.6"/>
      <polygon points="14,3 14,10 11,10" fill="#334155" stroke="#C084FC" stroke-width="0.6"/>
      <polygon points="18,10 14,17 14,10" fill="#0F172A" stroke="#1E293B" stroke-width="0.6"/>
      <polygon points="11,10 14,17 14,10" fill="#7C3AED" stroke="#C084FC" stroke-width="0.6"/>
      <!-- Central Singularity Core -->
      <polygon points="10,6 13,10 10,14 7,10" fill="#00F0FF" stroke="#FFFFFF" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="1.5" fill="#FFFFFF"/>
    </g>
  </defs>

  <style>
    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes flowPacket {
      0% { stroke-dashoffset: 240; opacity: 0.2; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px #00F0FF); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes signalWave {
      0% { r: 10; opacity: 0.9; }
      100% { r: 48; opacity: 0; }
    }
    @keyframes hudCardPulse {
      0%, 100% { stroke: rgba(56, 189, 248, 0.25); }
      50% { stroke: rgba(0, 240, 255, 0.7); }
    }

    .core-ring-1 { transform-origin: 960px 200px; animation: rotateClockwise 22s linear infinite; }
    .core-ring-2 { transform-origin: 960px 200px; animation: rotateCounter 15s linear infinite; }
    .core-ring-3 { transform-origin: 960px 200px; animation: rotateClockwise 30s linear infinite; }
    .pulse-hub { transform-origin: 960px 200px; animation: pulseCore 3.5s ease-in-out infinite; }
    .beacon-dot { animation: beaconBlink 2s ease-in-out infinite; }
    .radar-wave { transform-origin: 960px 200px; animation: signalWave 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
    .radar-wave-delayed { transform-origin: 960px 200px; animation: signalWave 3s cubic-bezier(0.1, 0.8, 0.3, 1) 1.5s infinite; }
    
    .stream-fast { stroke-dasharray: 20 80; animation: flowPacket 3.2s linear infinite; }
    .stream-slow { stroke-dasharray: 30 120; animation: flowPacket 4.8s linear infinite; }
    .hud-card { animation: hudCardPulse 4s ease-in-out infinite; }

    .title-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 56px; fill: url(#holo-title); letter-spacing: 2px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 17px; fill: #E2E8F0; }
    .hud-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748B; font-weight: 600; letter-spacing: 0.5px; }
    .hud-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #00F0FF; font-weight: 700; }
    .tile-h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #F8FAFC; }
    .tile-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Canvas Surface -->
  <rect width="1200" height="420" rx="18" fill="url(#bg-space)"/>
  <rect width="1200" height="420" rx="18" fill="url(#cyan-glow)"/>
  <rect width="1200" height="420" rx="18" fill="url(#purple-glow)"/>

  <!-- High-Tech Matrix Grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" />
    <path d="M 120,0 L 120,420 M 240,0 L 240,420 M 360,0 L 360,420 M 480,0 L 480,420 M 600,0 L 600,420 M 720,0 L 720,420 M 840,0 L 840,420 M 960,0 L 960,420 M 1080,0 L 1080,420" />
  </g>

  <!-- Animated Data Streams -->
  <g fill="none" stroke-linecap="round">
    <path d="M 60,65 L 680,65 Q 730,65 760,95 L 840,175" stroke="#1E293B" stroke-width="2"/>
    <path d="M 60,65 L 680,65 Q 730,65 760,95 L 840,175" stroke="#00F0FF" stroke-width="2" class="stream-fast" filter="url(#core-glow)"/>

    <path d="M 520,200 L 830,200" stroke="#1E293B" stroke-width="2"/>
    <path d="M 520,200 L 830,200" stroke="#818CF8" stroke-width="2" class="stream-slow"/>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT SIDE: TACHYON REACTOR CORE & TELEMETRY -->
  <!-- ================================================================= -->
  <g id="tachyon-core-system">
    <!-- Pulsing Radar Waves -->
    <circle cx="960" cy="200" r="10" fill="none" stroke="#00F0FF" stroke-width="1.5" class="radar-wave"/>
    <circle cx="960" cy="200" r="10" fill="none" stroke="#818CF8" stroke-width="1.5" class="radar-wave-delayed"/>

    <!-- Orbit Ring 3 -->
    <g class="core-ring-3">
      <circle cx="960" cy="200" r="140" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="10 14"/>
      <circle cx="1100" cy="200" r="5" fill="#38BDF8" filter="url(#core-glow)"/>
      <circle cx="820" cy="200" r="4" fill="#C084FC"/>
      <circle cx="960" cy="60" r="4" fill="#10B981"/>
    </g>

    <!-- Orbit Ring 2 -->
    <g class="core-ring-2">
      <circle cx="960" cy="200" r="105" fill="none" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="60 20 30 15"/>
      <rect x="955" y="93" width="10" height="4" rx="2" fill="#00F0FF"/>
      <rect x="955" y="303" width="10" height="4" rx="2" fill="#818CF8"/>
    </g>

    <!-- Orbit Ring 1 -->
    <g class="core-ring-1">
      <circle cx="960" cy="200" r="70" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="40 15"/>
      <circle cx="1030" cy="200" r="5" fill="#00F0FF" filter="url(#core-glow)"/>
      <circle cx="890" cy="200" r="4" fill="#10B981"/>
    </g>

    <!-- Central Hub with Lightning Icon -->
    <g class="pulse-hub">
      <circle cx="960" cy="200" r="40" fill="#0F172A" stroke="#00F0FF" stroke-width="2"/>
      <circle cx="960" cy="200" r="30" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
      <path d="M 962,180 L 950,199 L 958,199 L 956,218 L 972,195 L 964,195 Z" fill="url(#holo-title)" filter="url(#core-glow)"/>
    </g>

    <!-- Clean Floating Telemetry Badges (Calculated Non-Overlapping Positions) -->
    <!-- Badge 1: Top Left -->
    <g transform="translate(810, 60)">
      <rect width="130" height="34" rx="8" fill="#0B132B" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="17" r="4" fill="#10B981" class="beacon-dot"/>
      <text x="26" y="15" class="hud-label">RAM (RSS)</text>
      <text x="26" y="28" class="hud-value" fill="#10B981">4.2 MiB</text>
    </g>

    <!-- Badge 2: Right Center -->
    <g transform="translate(1030, 183)">
      <rect width="135" height="34" rx="8" fill="#0B132B" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="17" r="4" fill="#38BDF8"/>
      <text x="26" y="15" class="hud-label">ARCHIVE / MUSL</text>
      <text x="26" y="28" class="hud-value" fill="#38BDF8">3.7 MiB TAR.GZ</text>
    </g>

    <!-- Badge 3: Bottom Left -->
    <g transform="translate(810, 315)">
      <rect width="135" height="34" rx="8" fill="#0B132B" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="17" r="4" fill="#00F0FF" class="beacon-dot"/>
      <text x="26" y="15" class="hud-label">GC PAUSES</text>
      <text x="26" y="28" class="hud-value" fill="#00F0FF">0.00 ms (ZERO)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT SIDE: TITLE, SUBTITLE & 3 SPACIOUS TILES -->
  <!-- ================================================================= -->
  <g transform="translate(60, 48)">
    <!-- Top System Live Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10B981" class="beacon-dot"/>
      <text x="26" y="17" class="hud-value" fill="#38BDF8">OPENWRT 23.05 - 25.X &amp; SNAPSHOT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" class="title-main" filter="url(#neon-glow)">TACHYON CORE</text>
    <text x="0" y="78" class="title-main">TACHYON CORE</text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle-text">High-performance pure-Rust network routing core for OpenWrt routers &amp; servers</text>

    <!-- 4 Quick Pills -->
    <g transform="translate(0, 142)">
      <g transform="translate(0, 0)">
        <rect width="125" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="17" class="hud-value" fill="#38BDF8">⚡ 100% Rust</text>
      </g>
      <g transform="translate(135, 0)">
        <rect width="135" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="17" class="hud-value" fill="#10B981">🧠 4.2 MiB RAM</text>
      </g>
      <g transform="translate(280, 0)">
        <rect width="145" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="17" class="hud-value" fill="#C084FC">📦 3.7 MiB tar.gz</text>
      </g>
      <g transform="translate(435, 0)">
        <rect width="135" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="17" class="hud-value" fill="#FF8A65">🛡️ Zero-GC</text>
      </g>
    </g>

    <!-- 3 Spacious, Clean Architectural Tiles (With Tachyon 3D Logo on Each Card) -->
    <g transform="translate(0, 215)">
      <!-- Tile 1 -->
      <g transform="translate(0, 0)">
        <rect width="205" height="88" rx="10" fill="url(#card-grad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" class="hud-card"/>
        <use href="#tachyon-mini-logo" x="14" y="15"/>
        <text x="40" y="30" class="tile-h">Adaptive Engine</text>
        <text x="16" y="54" class="tile-sub" fill="#38BDF8">0.00 ms GC PAUSES</text>
        <text x="16" y="70" class="tile-sub" fill="#64748B">4 RAM Tiers · Auto-Tune</text>
      </g>

      <!-- Tile 2 -->
      <g transform="translate(220, 0)">
        <rect width="205" height="88" rx="10" fill="url(#card-grad)" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1" class="hud-card"/>
        <use href="#tachyon-mini-logo" x="14" y="15"/>
        <text x="40" y="30" class="tile-h">11 Architectures</text>
        <text x="16" y="54" class="tile-sub" fill="#818CF8">~7.0 MiB MUSL STATIC</text>
        <text x="16" y="70" class="tile-sub" fill="#64748B">ARM · MIPS · RISC-V · x86</text>
      </g>

      <!-- Tile 3 -->
      <g transform="translate(440, 0)">
        <rect width="215" height="88" rx="10" fill="url(#card-grad)" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1" class="hud-card"/>
        <use href="#tachyon-mini-logo" x="14" y="15"/>
        <text x="40" y="30" class="tile-h">Next-Gen Transports</text>
        <text x="16" y="54" class="tile-sub" fill="#C084FC">POST-QUANTUM TLS 1.3</text>
        <text x="16" y="70" class="tile-sub" fill="#64748B">AWG 2/3 · REALITY · XHTTP</text>
      </g>
    </g>
  </g>
</svg>
