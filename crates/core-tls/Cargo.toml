[package]
name = "core-tls"
description = "TLS stack integration: pure-Rust crypto provider, fingerprint/REALITY spikes, ring-free QUIC backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
core-crypto = { path = "../core-crypto" }
quinn-proto = { version = "0.11.18", default-features = false }
bytes.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
# the key shares: the hybrid, its X25519 half, and the p256 point Firefox offers
ml-kem.workspace = true
x25519-dalek.workspace = true
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdh"] }
sha2.workspace = true
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "macros", "time"] }
webpki-roots = "0.26"
brotli = "9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = "0.8"
rustls-webpki = { version = "0.103.14", default-features = false, features = ["alloc"] }

[dev-dependencies]
webpki-roots = "0.26"
rustls-pemfile = "2"
bytes.workspace = true
aes-gcm.workspace = true
# the server is judged by rustls' client, which needs its async wrapper
tokio-rustls.workspace = true
