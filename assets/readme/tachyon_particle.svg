<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <title>Tachyon Particle - Relativistic Quantum Singularity (v > c)</title>
  <defs>
    <!-- Deep Space Vacuum -->
    <radialGradient id="vacuum-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B132B" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#070B18" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#02040A" stop-opacity="1"/>
    </radialGradient>

    <!-- Cherenkov Shock Field -->
    <radialGradient id="cherenkov-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Singularity Radiant Core -->
    <radialGradient id="singularity-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- FTL Trajectory Beams -->
    <linearGradient id="beam-incoming" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beam-outgoing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#F43F5E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <!-- Brand Label Gradient -->
    <linearGradient id="hud-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Super-Luminous Filters -->
    <filter id="core-bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="640">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feGaussianBlur stdDeviation="35" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="640">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseSingularity {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px #00F0FF); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 45px #38BDF8); }
    }
    @keyframes wavePulse {
      0% { r: 35px; opacity: 0.9; stroke-width: 2.5px; }
      50% { opacity: 0.4; }
      100% { r: 260px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes laserPulse {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }

    .shock-wave-1 { transform-origin: 600px 320px; animation: wavePulse 3s cubic-bezier(0.1, 0.7, 0.2, 1) infinite; }
    .shock-wave-2 { transform-origin: 600px 320px; animation: wavePulse 3s cubic-bezier(0.1, 0.7, 0.2, 1) 1.5s infinite; }
    .singularity-core { transform-origin: 600px 320px; animation: pulseSingularity 2.6s ease-in-out infinite; }
    .ring-outer { transform-origin: 600px 320px; animation: spinClockwise 24s linear infinite; }
    .ring-middle { transform-origin: 600px 320px; animation: spinCounter 14s linear infinite; }
    .ring-inner { transform-origin: 600px 320px; animation: spinClockwise 8s linear infinite; }
    .laser-track { stroke-dasharray: 30 60; animation: laserPulse 1s linear infinite; }
    .quantum-flicker { animation: flicker 2s ease-in-out infinite; }

    .hud-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; }
  </style>

  <!-- Deep Vacuum Canvas -->
  <rect width="1200" height="640" rx="20" fill="url(#vacuum-bg)"/>
  
  <!-- Relativistic Space-Time Grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320 M 0,400 L 1200,400 M 0,480 L 1200,480 M 0,560 L 1200,560" />
    <path d="M 120,0 L 120,640 M 240,0 L 240,640 M 360,0 L 360,640 M 480,0 L 480,640 M 600,0 L 600,640 M 720,0 L 720,640 M 840,0 L 840,640 M 960,0 L 960,640 M 1080,0 L 1080,640" />
  </g>

  <!-- Cherenkov Radiation Field -->
  <circle cx="600" cy="320" r="280" fill="url(#cherenkov-halo)"/>

  <!-- ================================================================= -->
  <!-- RELATIVISTIC CHERENKOV MACH-SHOCKWAVES (v > c) -->
  <!-- ================================================================= -->
  <!-- Symmetrical Mach Cones -->
  <g fill="none">
    <!-- Left Cones (Past / Inverted Time Trajectory) -->
    <path d="M 600,320 L 120,90 Q 50,320 120,550 Z" fill="#00F0FF" fill-opacity="0.04" stroke="#00F0FF" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="8 6"/>
    <path d="M 600,320 L 240,150 Q 180,320 240,490 Z" fill="#38BDF8" fill-opacity="0.05" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.6"/>

    <!-- Right Cones (Future Wave Horizon) -->
    <path d="M 600,320 L 1080,90 Q 1150,320 1080,550 Z" fill="#C084FC" fill-opacity="0.04" stroke="#C084FC" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="8 6"/>
    <path d="M 600,320 L 960,150 Q 1020,320 960,490 Z" fill="#818CF8" fill-opacity="0.05" stroke="#818CF8" stroke-width="1.8" stroke-opacity="0.6"/>

    <!-- Concentric Cherenkov Shock Wavefront Arcs -->
    <path d="M 380,214 A 140 140 0 0 0 380,426" stroke="#00F0FF" stroke-width="1.4" stroke-opacity="0.4"/>
    <path d="M 280,168 A 240 240 0 0 0 280,472" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.25"/>
    <path d="M 820,214 A 140 140 0 0 1 820,426" stroke="#C084FC" stroke-width="1.4" stroke-opacity="0.4"/>
    <path d="M 920,168 A 240 240 0 0 1 920,472" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.25"/>
  </g>

  <!-- ================================================================= -->
  <!-- FASTER-THAN-LIGHT HORIZONTAL BEAMS -->
  <!-- ================================================================= -->
  <g stroke-linecap="round">
    <line x1="40" y1="320" x2="600" y2="320" stroke="url(#beam-incoming)" stroke-width="3" filter="url(#soft-glow)"/>
    <line x1="80" y1="320" x2="580" y2="320" stroke="#00F0FF" stroke-width="2" class="laser-track"/>

    <line x1="600" y1="320" x2="1160" y2="320" stroke="url(#beam-outgoing)" stroke-width="3" filter="url(#soft-glow)"/>
    <line x1="620" y1="320" x2="1120" y2="320" stroke="#C084FC" stroke-width="2" class="laser-track"/>
  </g>

  <!-- Expanding Quantum Waves -->
  <circle cx="600" cy="320" r="35" fill="none" stroke="#00F0FF" class="shock-wave-1" filter="url(#core-bloom)"/>
  <circle cx="600" cy="320" r="35" fill="none" stroke="#818CF8" class="shock-wave-2" filter="url(#core-bloom)"/>

  <!-- ================================================================= -->
  <!-- ROTATING FIELD GYROSCOPES -->
  <!-- ================================================================= -->
  <!-- Ring 3: Outer Quantum Boundary -->
  <g class="ring-outer">
    <circle cx="600" cy="320" r="190" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="10 16"/>
    <!-- 4 Cardinal Virtual Photons -->
    <circle cx="790" cy="320" r="6" fill="#00F0FF" filter="url(#core-bloom)"/>
    <circle cx="410" cy="320" r="6" fill="#00F0FF" filter="url(#core-bloom)"/>
    <circle cx="600" cy="130" r="5" fill="#C084FC" filter="url(#core-bloom)"/>
    <circle cx="600" cy="510" r="5" fill="#C084FC" filter="url(#core-bloom)"/>
  </g>

  <!-- Ring 2: Middle Kinetic Flux Ribbon -->
  <g class="ring-middle">
    <circle cx="600" cy="320" r="140" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="75 25 35 15" stroke-linecap="round" filter="url(#core-bloom)"/>
    <polygon points="600,170 612,185 588,185" fill="#00F0FF"/>
    <polygon points="600,470 612,455 588,455" fill="#C084FC"/>
    <polygon points="460,320 475,308 475,332" fill="#38BDF8"/>
    <polygon points="740,320 725,308 725,332" fill="#818CF8"/>
  </g>

  <!-- Ring 1: Inner Ergosphere Barrier -->
  <g class="ring-inner">
    <circle cx="600" cy="320" r="90" fill="none" stroke="#818CF8" stroke-width="3" stroke-dasharray="45 15" stroke-linecap="round" filter="url(#core-bloom)"/>
    <circle cx="690" cy="320" r="7" fill="#FFFFFF" filter="url(#core-bloom)"/>
    <circle cx="510" cy="320" r="7" fill="#00F0FF" filter="url(#core-bloom)"/>
  </g>

  <!-- ================================================================= -->
  <!-- QUANTUM SINGULARITY (NEGATIVE REST MASS CORE: m² < 0) -->
  <!-- ================================================================= -->
  <g class="singularity-core">
    <!-- Outer Radiant Halo -->
    <circle cx="600" cy="320" r="75" fill="url(#singularity-glow)"/>

    <!-- Hyper-Dimensional Diamond Shell -->
    <polygon points="600,245 675,320 600,395 525,320" fill="#090E1A" stroke="#00F0FF" stroke-width="2.5" filter="url(#core-bloom)"/>
    
    <!-- Inverted Relativistic Octagram (m² < 0) -->
    <polygon points="600,260 618,300 660,320 618,340 600,380 582,340 540,320 582,300" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Central Energy Singularity -->
    <circle cx="600" cy="320" r="14" fill="#FFFFFF" class="quantum-flicker" filter="url(#core-bloom)"/>
    <circle cx="600" cy="320" r="6" fill="#00F0FF"/>
  </g>

  <!-- Quantum Pair Emissions -->
  <g opacity="0.85">
    <circle cx="630" cy="260" r="2.5" fill="#00F0FF" class="quantum-flicker"/>
    <circle cx="560" cy="375" r="2" fill="#38BDF8" class="quantum-flicker"/>
    <circle cx="675" cy="300" r="3" fill="#C084FC" class="quantum-flicker"/>
    <circle cx="525" cy="290" r="2.5" fill="#00F0FF" class="quantum-flicker"/>
    <circle cx="655" cy="350" r="2" fill="#FFFFFF" class="quantum-flicker"/>
    <circle cx="545" cy="340" r="3" fill="#818CF8" class="quantum-flicker"/>
  </g>

  <!-- ================================================================= -->
  <!-- MINIMAL HUD TELEMETRY LABELS (ONLY ESSENCE) -->
  <!-- ================================================================= -->
  <!-- Top Title -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <text y="0" class="hud-mono" fill="#00F0FF" font-size="14">⚡ TACHYON PARTICLE // v &gt; c</text>
  </g>

  <!-- Bottom Identity -->
  <g transform="translate(600, 595)" text-anchor="middle">
    <text y="0" class="hud-mono" fill="url(#hud-gradient)" font-size="12">
      v &gt; c &#160;•&#160; m² &lt; 0 &#160;•&#160; Δt &lt; 0 &#160;•&#160; ZERO LATENCY HORIZON
    </text>
  </g>
</svg>
