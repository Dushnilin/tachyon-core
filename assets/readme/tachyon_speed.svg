<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <title>Tachyon Core - Relativistic Speed &amp; Line-Rate Throughput</title>
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <radialGradient id="speed-bg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#090D16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="speed-cyan-glow" cx="20%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="speed-purple-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Holographic Title Gradient -->
    <linearGradient id="speed-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="gauge-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="85%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="speed-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="laser-stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="speed-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="320">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="core-speed-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="320">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes warpDash1 {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes warpDash2 {
      0% { stroke-dashoffset: 180; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseSpeedHub {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 12px #00F0FF); }
    }
    @keyframes speedRadarSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes beaconFast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .warp-track-1 { stroke-dasharray: 24 48; animation: warpDash1 1.4s linear infinite; }
    .warp-track-2 { stroke-dasharray: 16 32; animation: warpDash2 0.9s linear infinite; }
    .warp-track-3 { stroke-dasharray: 32 64; animation: warpDash1 2.0s linear infinite; }
    .gauge-pulse { transform-origin: 190px 185px; animation: pulseSpeedHub 2.5s ease-in-out infinite; }
    .radar-rot { transform-origin: 190px 185px; animation: speedRadarSweep 4s linear infinite; }
    .beacon-fast { animation: beaconFast 1.2s ease-in-out infinite; }

    .speed-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 20px; fill: url(#speed-title-grad); letter-spacing: 1px; }
    .speed-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #94A3B8; }
    .metric-hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #F8FAFC; }
    .metric-num { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 26px; font-weight: 900; }
    .metric-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#speed-bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="16" fill="url(#speed-cyan-glow)"/>
  <rect width="1200" height="320" rx="16" fill="url(#speed-purple-glow)"/>

  <!-- Matrix Grid Lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,130 L 1200,130 M 0,200 L 1200,200 M 0,265 L 1200,265" />
    <path d="M 120,0 L 120,320 M 240,0 L 240,320 M 360,0 L 360,320 M 480,0 L 480,320 M 600,0 L 600,320 M 720,0 L 720,320 M 840,0 L 840,320 M 960,0 L 960,320 M 1080,0 L 1080,320" />
  </g>

  <!-- Top Header -->
  <g transform="translate(45, 28)">
    <rect width="210" height="22" rx="11" fill="#0B132B" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="12" cy="11" r="3.5" fill="#00F0FF" class="beacon-fast"/>
    <text x="24" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#00F0FF">THROUGHPUT &amp; ZERO-COPY</text>

    <text x="0" y="44" class="speed-title">⚡ TACHYON RELATIVISTIC VELOCITY PIPELINE</text>
    <text x="0" y="62" class="speed-sub">Линейная аппаратная скорость 10G, нулевое копирование и детерминированный RAII</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT: LINE-RATE SPEEDOMETER HUD GAUGE -->
  <!-- ================================================================= -->
  <g transform="translate(190, 185)">
    <!-- Outer Track -->
    <circle r="84" fill="none" stroke="#1E293B" stroke-width="5"/>
    <!-- Animated Arc Track -->
    <circle r="84" fill="none" stroke="url(#gauge-grad)" stroke-width="5" stroke-dasharray="380 150" stroke-linecap="round" filter="url(#speed-glow)"/>
    
    <!-- Rotating Sensor Reticle -->
    <g class="radar-rot">
      <circle r="66" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 12"/>
      <circle cx="66" cy="0" r="3.5" fill="#00F0FF" filter="url(#core-speed-glow)"/>
      <circle cx="-66" cy="0" r="2.5" fill="#C084FC"/>
    </g>

    <!-- Speed Ticks -->
    <line x1="-72" y1="36" x2="-62" y2="30" stroke="#64748B" stroke-width="2"/>
    <line x1="-72" y1="-36" x2="-62" y2="-30" stroke="#64748B" stroke-width="2"/>
    <line x1="0" y1="-78" x2="0" y2="-66" stroke="#00F0FF" stroke-width="2"/>
    <line x1="72" y1="-36" x2="62" y2="-30" stroke="#818CF8" stroke-width="2"/>
    <line x1="72" y1="36" x2="62" y2="30" stroke="#C084FC" stroke-width="2"/>

    <!-- Central Fusion Core -->
    <g class="gauge-pulse">
      <circle r="46" fill="#090E1A" stroke="#00F0FF" stroke-width="2" filter="url(#core-speed-glow)"/>
      <circle r="36" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
      <!-- Lightning Icon -->
      <path d="M 2,-14 L -8,2 L 0,2 L -2,16 L 10,-2 L 2,-2 Z" fill="url(#speed-title-grad)"/>
    </g>

    <!-- Speed Readout -->
    <text y="64" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1">10 Gbps LINE-SPEED</text>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER: DYNAMIC WARP CONDUITS -->
  <!-- ================================================================= -->
  <g fill="none" stroke-linecap="round" transform="translate(300, 115)">
    <path d="M 0,20 L 260,20" stroke="#1E293B" stroke-width="2"/>
    <path d="M 0,20 L 260,20" stroke="#10B981" stroke-width="2.5" class="warp-track-2" filter="url(#speed-glow)"/>

    <path d="M 0,55 L 260,55" stroke="#1E293B" stroke-width="3"/>
    <path d="M 0,55 L 260,55" stroke="url(#laser-stream-grad)" stroke-width="3.5" class="warp-track-1" filter="url(#core-speed-glow)"/>

    <path d="M 0,90 L 260,90" stroke="#1E293B" stroke-width="2"/>
    <path d="M 0,90 L 260,90" stroke="#00F0FF" stroke-width="2.5" class="warp-track-2" filter="url(#speed-glow)"/>

    <path d="M 0,125 L 260,125" stroke="#1E293B" stroke-width="2"/>
    <path d="M 0,125 L 260,125" stroke="#C084FC" stroke-width="2.5" class="warp-track-3"/>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT: 4 CLEAN SPEED PODS (No Clutter, Pure Essence) -->
  <!-- ================================================================= -->
  <g transform="translate(600, 95)">
    <!-- Pod 1: Throughput -->
    <g transform="translate(0, 0)">
      <rect width="265" height="92" rx="10" fill="url(#speed-card-grad)" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2"/>
      <g transform="translate(16, 18)">
        <circle cx="12" cy="12" r="10" fill="#10B981" fill-opacity="0.15"/>
        <text x="6" y="16" font-size="12">⚡</text>
        <text x="30" y="16" class="metric-hdr">Throughput</text>
      </g>
      <text x="16" y="66" class="metric-num" fill="#34D399">10 Gbps+</text>
      <text x="145" y="62" class="metric-tag" fill="#10B981">ZERO-COPY</text>
      <text x="145" y="75" class="metric-tag" fill="#64748B">Splicing</text>
    </g>

    <!-- Pod 2: Packet Forwarding Rate -->
    <g transform="translate(285, 0)">
      <rect width="265" height="92" rx="10" fill="url(#speed-card-grad)" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.2"/>
      <g transform="translate(16, 18)">
        <circle cx="12" cy="12" r="10" fill="#00F0FF" fill-opacity="0.15"/>
        <text x="6" y="16" font-size="12">🚀</text>
        <text x="30" y="16" class="metric-hdr">Packet Forwarding</text>
      </g>
      <text x="16" y="66" class="metric-num" fill="#00F0FF">1.48 Mpps</text>
      <text x="155" y="62" class="metric-tag" fill="#38BDF8">STEADY-STATE</text>
      <text x="155" y="75" class="metric-tag" fill="#64748B">Zero Alloc</text>
    </g>

    <!-- Pod 3: Latency Jitter -->
    <g transform="translate(0, 108)">
      <rect width="265" height="92" rx="10" fill="url(#speed-card-grad)" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.2"/>
      <g transform="translate(16, 18)">
        <circle cx="12" cy="12" r="10" fill="#8B5CF6" fill-opacity="0.15"/>
        <text x="6" y="16" font-size="12">⏱️</text>
        <text x="30" y="16" class="metric-hdr">Tail Jitter</text>
      </g>
      <text x="16" y="66" class="metric-num" fill="#C084FC">0.00 ms</text>
      <text x="145" y="62" class="metric-tag" fill="#C084FC">ZERO-GC</text>
      <text x="145" y="75" class="metric-tag" fill="#64748B">Deterministic</text>
    </g>

    <!-- Pod 4: CPU Cycles -->
    <g transform="translate(285, 108)">
      <rect width="265" height="92" rx="10" fill="url(#speed-card-grad)" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.2"/>
      <g transform="translate(16, 18)">
        <circle cx="12" cy="12" r="10" fill="#F59E0B" fill-opacity="0.15"/>
        <text x="6" y="16" font-size="12">🧠</text>
        <text x="30" y="16" class="metric-hdr">Router CPU Cycles</text>
      </g>
      <text x="16" y="66" class="metric-num" fill="#FBBF24">&lt; 3% CPU</text>
      <text x="145" y="62" class="metric-tag" fill="#FBBF24">MIPS / ARM</text>
      <text x="145" y="75" class="metric-tag" fill="#64748B">Low Footprint</text>
    </g>
  </g>
</svg>
