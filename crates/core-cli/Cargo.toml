[package]
name = "core-cli"
description = "tachyon-core: sing-box-compatible proxy core optimized for routers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tachyon-core"
path = "src/main.rs"

[features]
default = ["full"]
full = [
    "core-config/full",
    "core-runtime/full",
]
lite = [
    "core-config/lite",
    "core-runtime/lite",
]
# counting allocator + per-second heap dump, see src/allocstat.rs
allocstat = ["core-runtime/allocstat"]

[dependencies]
core-config = { path = "../core-config", default-features = false }
core-runtime = { path = "../core-runtime", default-features = false }
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(all(target_os = "linux", not(target_env = "msvc")))'.dependencies]
libc.workspace = true

[target.'cfg(all(target_os = "linux", not(target_env = "msvc"), target_arch = "x86_64"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
