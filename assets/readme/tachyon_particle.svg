<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="title desc">
  <title id="title">tachyon-core — схема модулей рабочей области</title>
  <desc id="desc">Шесть основных крейтов рабочей области tachyon-core: core-cli, core-config, core-runtime, core-tls, core-crypto и core-ffi.</desc>

  <rect width="1200" height="320" rx="16" fill="#141415"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <text x="32" y="40" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="500">Модульная структура рабочей области Rust 2024</text>
  <text x="32" y="64" fill="#85858b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400">Изолированные крейты без внешних Си-зависимостей и со статической линковкой в единый исполняемый файл</text>

  <g transform="translate(32, 88)">
    <rect x="0" y="0" width="368" height="92" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="30" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500">core-cli</text>
    <text x="20" y="54" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Точка входа, инициализация рантайма Tokio</text>
    <text x="20" y="74" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">check · run · rule-set · generate</text>
  </g>

  <g transform="translate(416, 88)">
    <rect x="0" y="0" width="368" height="92" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="30" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500">core-config</text>
    <text x="20" y="54" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Строгая схема JSON, валидатор и парсер подписок</text>
    <text x="20" y="74" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">URI · Clash YAML · Xray · Happ · AWG</text>
  </g>

  <g transform="translate(800, 88)">
    <rect x="0" y="0" width="368" height="92" rx="12" fill="#19191b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500">core-runtime</text>
    <text x="20" y="54" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Data Plane: инбаунды, аутбаунды, роутер и DNS</text>
    <text x="20" y="74" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">.trs mmap · splice · adaptive RAM</text>
  </g>

  <g transform="translate(32, 196)">
    <rect x="0" y="0" width="368" height="92" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="30" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500">core-crypto</text>
    <text x="20" y="54" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Криптопровайдер на чистом Rust + ядерный AF_ALG</text>
    <text x="20" y="74" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">AES-GCM · ChaCha20 · X25519 · ML-KEM</text>
  </g>

  <g transform="translate(416, 196)">
    <rect x="0" y="0" width="368" height="92" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="30" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500">core-tls</text>
    <text x="20" y="54" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Стек TLS 1.3, отпечатки uTLS, REALITY и QUIC</text>
    <text x="20" y="74" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">13 профилей ClientHello · X25519MLKEM768</text>
  </g>

  <g transform="translate(800, 196)">
    <rect x="0" y="0" width="368" height="92" rx="12" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="30" fill="#ededed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500">core-ffi &amp; core-experimental</text>
    <text x="20" y="54" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400">Мобильные биндинги JNI / C-FFI и база bbolt</text>
    <text x="20" y="74" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400">libtachyon.so · XCFramework · cache.db</text>
  </g>
</svg>
