  <rect x="20" y="20" width="40" height="32" rx="6" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
  <text x="40" y="41" text-anchor="middle" fill="#a1a1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500">06</text>
  <text x="76" y="34" fill="#ededed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500">Дорожная карта, поддержка и условия лицензии</text>
  <text x="76" y="54" fill="#85858b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">Фазы разработки F0–F12, переход на нативный формат конфигурации и условия распространения бинарных сборок</text>
