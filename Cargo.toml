[workspace]
resolver = "2"
members = [
    "crates/core-cli",
    "crates/core-config",
    "crates/core-experimental",
    "crates/core-runtime",
    "crates/core-tls",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Dushnilin/tachyon-core"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
