name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR makes the previous run obsolete; don't queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SB_REF_VERSION: v1.14.2-lx.11

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The workspace .cargo/config.toml pins a local MSVC path; runners resolve
      # `link.exe` from PATH themselves.
      - name: Build (override local MSVC linker pin)
        if: runner.os == 'Windows'
        run: cargo build --workspace
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ runner.os == 'Windows' && 'link.exe' || '' }}
      - run: cargo test --workspace
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ runner.os == 'Windows' && 'link.exe' || '' }}
      # The exit gate needs CAP_NET_ADMIN (tproxy); re-run it as root so CI
      # covers what the unprivileged `cargo test` above can only skip.
      - name: Exit gate (privileged)
        if: runner.os == 'Linux'
        run: |
          sudo -E env "PATH=$PATH" cargo test -p core-runtime --test exit_gate -- --nocapture
          sudo -E env "PATH=$PATH" cargo test -p core-runtime --test inbounds -- --nocapture

  differential:
    name: check vs sing-box-lx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # run.sh refuses to start without a binary, so this build is not optional.
      - name: Build tachyon-core
        run: cargo build --workspace
      - name: Fetch reference sing-box-lx
        run: |
          curl -fsSL -o ref.tar.gz \
            "https://github.com/Leadaxe/sing-box-lx/releases/download/${SB_REF_VERSION}/sing-box-${SB_REF_VERSION#v}-linux-amd64.tar.gz"
          mkdir -p "$HOME/ref" && tar -xzf ref.tar.gz -C "$HOME/ref"
          REF_BIN="$(find "$HOME/ref" -type f -name sing-box | head -1)"
          chmod +x "$REF_BIN"
          echo "SING_BOX_REF=$REF_BIN" >> "$GITHUB_ENV"
          "$REF_BIN" version
      - name: Run differential harness
        env:
          STRICT: "1"
        run: bash tests/differential/run.sh

  cross:
    name: Cross build (musl)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-musleabihf
          - target: arm-unknown-linux-musleabi
          - target: riscv64gc-unknown-linux-musl
          # tier-3, no prebuilt std: the standard library is built from source
          - target: mipsel-unknown-linux-musl
            build-std: true
          - target: mips-unknown-linux-musl
            build-std: true
    steps:
      - uses: actions/checkout@v4
      # `rustup target add` refuses a tier-3 target outright -- there are no
      # prebuilt artifacts to add, and it says so and exits non-zero -- so the two
      # MIPS entries must not be asked to install their target. They get nightly
      # plus rust-src and let `-Z build-std` compile the standard library.
      - name: Toolchain (prebuilt std)
        if: ${{ !matrix.build-std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Toolchain (std from source)
        if: ${{ matrix.build-std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src
      # the toolchains are static musl: link with the bundled rust-lld and the
      # self-contained CRT objects instead of a host gcc that is not there
      - name: Link musl with rust-lld
        run: |
          echo "RUSTFLAGS=-C linker=rust-lld -C link-self-contained=yes" >> "$GITHUB_ENV"
      - name: Build
        run: |
          if [ -n "${{ matrix.build-std }}" ]; then
            cargo build --workspace --release --target ${{ matrix.target }} \
              -Z build-std=std,panic_abort
          else
            cargo build --workspace --release --target ${{ matrix.target }}
          fi
      - name: Size budget (<= 12 MiB)
        run: |
          size=$(stat -c%s "target/${{ matrix.target }}/release/tachyon-core")
          echo "size=$size bytes"
          test "$size" -le 12582912
      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-core-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/tachyon-core