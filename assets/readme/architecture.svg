<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <title>tachyon-core Architecture &amp; Zero-Copy Pipeline</title>
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <radialGradient id="arch-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#090D16" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="card-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="arch-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glowing Filters with userSpaceOnUse -->
    <filter id="neon-green" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-cyan" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-purple" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-amber" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-pink" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flowCyan {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowGreen {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowPurple {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowAmber {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowPink {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulseCardBorder {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.95; }
    }

    @keyframes blinkLed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .stream-lan { stroke-dasharray: 14 28; animation: flowCyan 2.2s linear infinite; }
    .stream-direct { stroke-dasharray: 14 28; animation: flowGreen 1.8s linear infinite; }
    .stream-vless { stroke-dasharray: 14 28; animation: flowCyan 1.6s linear infinite; }
    .stream-awg { stroke-dasharray: 14 28; animation: flowPurple 2.0s linear infinite; }
    .stream-heavy { stroke-dasharray: 14 28; animation: flowAmber 2.2s linear infinite; }
    .stream-dns { stroke-dasharray: 14 28; animation: flowPink 2.4s linear infinite; }

    .card-pulse-cyan { animation: pulseCardBorder 3.2s ease-in-out infinite; }
    .card-pulse-purple { animation: pulseCardBorder 2.8s ease-in-out infinite; }
    .card-pulse-green { animation: pulseCardBorder 2.4s ease-in-out infinite; }
    .card-pulse-amber { animation: pulseCardBorder 2.6s ease-in-out infinite; }
    .card-pulse-pink { animation: pulseCardBorder 3.0s ease-in-out infinite; }

    .led-dot { animation: blinkLed 2s ease-in-out infinite; }

    .title-h1 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 20px; fill: url(#arch-title-grad); letter-spacing: 1px; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #94A3B8; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #F8FAFC; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #94A3B8; }
    .tag-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Surface -->
  <rect width="1200" height="620" rx="16" fill="url(#arch-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Title Header -->
  <g transform="translate(45, 40)">
    <text class="title-h1">⚡ TACHYON-CORE ZERO-COPY TRAFFIC PIPELINE</text>
    <text y="22" class="title-sub">Асинхронный сетевой конвейер перехвата пакетов ядра Linux и туннелирования</text>
  </g>

  <!-- ================================================================= -->
  <!-- CONNECTING HIGH-SPEED CONDUITS (Animated Laser Streams) -->
  <!-- ================================================================= -->
  <g fill="none" stroke-linecap="round">
    <!-- Inbound: Clients -> Core -->
    <path d="M 225,325 L 350,325" stroke="#1E293B" stroke-width="4"/>
    <path d="M 225,325 L 350,325" stroke="#00F0FF" stroke-width="3.5" class="stream-lan" filter="url(#neon-cyan)"/>

    <!-- Path 1: Direct WAN (Green) -->
    <path d="M 590,260 C 660,260 700,120 780,120 L 890,120" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,260 C 660,260 700,120 780,120 L 890,120" stroke="#10B981" stroke-width="3.5" class="stream-direct" filter="url(#neon-green)"/>

    <!-- Path 2: Post-Quantum VLESS (Cyan) -->
    <path d="M 590,290 C 660,290 710,215 780,215 L 890,215" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,290 C 660,290 710,215 780,215 L 890,215" stroke="#00F0FF" stroke-width="3.5" class="stream-vless" filter="url(#neon-cyan)"/>

    <!-- Path 3: AmneziaWG 2/3 (Purple) -->
    <path d="M 590,325 L 890,325" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,325 L 890,325" stroke="#C084FC" stroke-width="3.5" class="stream-awg" filter="url(#neon-purple)"/>

    <!-- Path 4: XHTTP & Hysteria2 (Amber) -->
    <path d="M 590,360 C 660,360 710,435 780,435 L 890,435" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,360 C 660,360 710,435 780,435 L 890,435" stroke="#F59E0B" stroke-width="3.5" class="stream-heavy" filter="url(#neon-amber)"/>

    <!-- Path 5: Smart DNS & FakeIP (Pink) -->
    <path d="M 590,390 C 660,390 700,530 780,530 L 890,530" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,390 C 660,390 700,530 780,530 L 890,530" stroke="#EC4899" stroke-width="3.5" class="stream-dns" filter="url(#neon-pink)"/>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT COLUMN: INBOUNDS -->
  <!-- ================================================================= -->
  <g transform="translate(45, 185)">
    <rect width="180" height="280" rx="12" fill="url(#card-glass)" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(15, 15)">
      <rect width="36" height="36" rx="8" fill="#0284C7" fill-opacity="0.25"/>
      <text x="9" y="24" font-size="18">📥</text>
      <text x="46" y="22" class="node-title">Inbounds</text>
      <text x="46" y="34" class="node-sub">Перехват ядра</text>
    </g>

    <!-- Inbound Items -->
    <g transform="translate(15, 68)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12">Linux TProxy (v4/v6)</text>
      <text x="10" y="34" class="tag-mono" fill="#38BDF8">IP_TRANSPARENT</text>
    </g>
    <g transform="translate(15, 118)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12">Redirect (NAT)</text>
      <text x="10" y="34" class="tag-mono" fill="#38BDF8">SO_ORIGINAL_DST</text>
    </g>
    <g transform="translate(15, 168)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12">Mixed SOCKS5 / HTTP</text>
      <text x="10" y="34" class="tag-mono" fill="#38BDF8">CONNECT + 407 Auth</text>
    </g>
    <g transform="translate(15, 218)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12">Kernel TUN</text>
      <text x="10" y="34" class="tag-mono" fill="#38BDF8">stack: system / smoltcp</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER COLUMN: TACHYON CORE ENGINE -->
  <!-- ================================================================= -->
  <g transform="translate(350, 140)">
    <rect width="240" height="370" rx="14" fill="#090E1A" stroke="#00F0FF" stroke-width="2" class="card-pulse-cyan"/>
    
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="16" fill="#00F0FF" fill-opacity="0.15"/>
      <text x="10" y="24" font-size="18">⚡</text>
      <text x="44" y="16" class="node-title" fill="#00F0FF">Tachyon Core</text>
      <text x="44" y="30" class="node-sub">Rust Tokio + Zero-Copy</text>
    </g>

    <!-- Sub-Engines in Core -->
    <g transform="translate(18, 70)">
      <!-- 1. Zero-Alloc Router -->
      <g transform="translate(0, 0)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#10B981" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">Zero-Alloc Router</text>
        <text x="26" y="38" class="tag-mono" fill="#34D399">CIDR, Suffix, GeoIP, Marks</text>
      </g>

      <!-- 2. PeekStream Sniffer -->
      <g transform="translate(0, 60)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#38BDF8" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">PeekStream Sniffer</text>
        <text x="26" y="38" class="tag-mono" fill="#38BDF8">TLS SNI, HTTP Host, DNS</text>
      </g>

      <!-- 3. Tokio Splicer -->
      <g transform="translate(0, 120)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#A855F7" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">Tokio Splicer</text>
        <text x="26" y="38" class="tag-mono" fill="#C084FC">bytes::Bytes Zero-Copy Pipe</text>
      </g>

      <!-- 4. RustCrypto Provider -->
      <g transform="translate(0, 180)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#F59E0B" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">RustCrypto Provider</text>
        <text x="26" y="38" class="tag-mono" fill="#FBBF24">Pure Rust (No Ring / No CGO)</text>
      </g>

      <!-- 5. Flood Protection -->
      <g transform="translate(0, 240)">
        <rect width="204" height="42" rx="8" fill="#1E1B4B" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="14" cy="21" r="4" fill="#EC4899" class="led-dot"/>
        <text x="26" y="20" class="node-title" font-size="11" fill="#F472B6">Flood Drop Protection</text>
        <text x="26" y="34" class="tag-mono" fill="#EC4899">Автоматический дроп шторма</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: 5 DESTINATIONS -->
  <!-- ================================================================= -->

  <!-- DESTINATION 1: DIRECT WAN (GREEN) -->
  <g transform="translate(890, 75)">
    <rect width="265" height="85" rx="10" fill="url(#card-glass)" stroke="#10B981" stroke-width="1.5" class="card-pulse-green"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#10B981" fill-opacity="0.15"/>
      <text x="8" y="22" font-size="16">🌐</text>
      <text x="38" y="16" class="node-title" fill="#34D399">Direct WAN</text>
      <text x="38" y="28" class="tag-mono" fill="#10B981">0 ms OVERHEAD</text>
    </g>
    <text x="16" y="60" class="node-sub" fill="#E2E8F0">Банки, Госуслуги, доверенные хосты</text>
    <text x="16" y="74" class="node-sub">Прямой транзит без проксирования</text>
  </g>

  <!-- DESTINATION 2: POST-QUANTUM VLESS (CYAN) -->
  <g transform="translate(890, 175)">
    <rect width="265" height="85" rx="10" fill="url(#card-glass)" stroke="#00F0FF" stroke-width="1.5" class="card-pulse-cyan"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#00F0FF" fill-opacity="0.15"/>
      <text x="8" y="22" font-size="16">🔒</text>
      <text x="38" y="16" class="node-title" fill="#00F0FF">VLESS Post-Quantum</text>
      <text x="38" y="28" class="tag-mono" fill="#38BDF8">ML-KEM-768 HYBRID</text>
    </g>
    <text x="16" y="60" class="node-sub" fill="#E2E8F0">Защита от квантового перехвата</text>
    <text x="16" y="74" class="node-sub">uTLS Chrome + REALITY фрагментация</text>
  </g>

  <!-- DESTINATION 3: AMNEZIAWG 2.0 / 3.x (PURPLE) -->
  <g transform="translate(890, 275)">
    <rect width="265" height="85" rx="10" fill="url(#card-glass)" stroke="#8B5CF6" stroke-width="1.5" class="card-pulse-purple"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="8" y="22" font-size="16">🛡️</text>
      <text x="38" y="16" class="node-title" fill="#C084FC">AmneziaWG 2.0 / 3.x</text>
      <text x="38" y="28" class="tag-mono" fill="#C084FC">JUNK HEADERS &amp; DECOYS</text>
    </g>
    <text x="16" y="60" class="node-sub" fill="#E2E8F0">jc/jmin/jmax, паддинг контента</text>
    <text x="16" y="74" class="node-sub">Маскировка: DNS, STUN, SIP, QUIC</text>
  </g>

  <!-- DESTINATION 4: XHTTP & HYSTERIA2 (AMBER) -->
  <g transform="translate(890, 375)">
    <rect width="265" height="85" rx="10" fill="url(#card-glass)" stroke="#F59E0B" stroke-width="1.5" class="card-pulse-amber"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="8" y="22" font-size="16">🚀</text>
      <text x="38" y="16" class="node-title" fill="#FBBF24">XHTTP &amp; Hysteria2</text>
      <text x="38" y="28" class="tag-mono" fill="#F59E0B">HTTP/2 XMUX &amp; QUINN</text>
    </g>
    <text x="16" y="60" class="node-sub" fill="#E2E8F0">H2 xmux / stream-up / packet-up</text>
    <text x="16" y="74" class="node-sub">UDP мультиплексирование TUIC &amp; Hy2</text>
  </g>

  <!-- DESTINATION 5: SMART DNS & FAKEIP (PINK) -->
  <g transform="translate(890, 475)">
    <rect width="265" height="85" rx="10" fill="url(#card-glass)" stroke="#EC4899" stroke-width="1.5" class="card-pulse-pink"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#EC4899" fill-opacity="0.15"/>
      <text x="8" y="22" font-size="16">🌐</text>
      <text x="38" y="16" class="node-title" fill="#F472B6">Smart DNS &amp; FakeIP</text>
      <text x="38" y="28" class="tag-mono" fill="#EC4899">198.18.0.0/15 POOL</text>
    </g>
    <text x="16" y="60" class="node-sub" fill="#E2E8F0">DoH (h2/h1), DoT, UDP резолвер</text>
    <text x="16" y="74" class="node-sub">Кэш ответов LRU, защита от перехвата</text>
  </g>
</svg>
