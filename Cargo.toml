[workspace]
resolver = "2"
members = [
    "crates/core-cli",
    "crates/core-config",
    "crates/core-experimental",
    "crates/core-runtime",
    "crates/core-tls",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Dushnilin/tachyon-core"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
aes = "0.8"
aes-gcm = "0.10"
blake3 = "1"
bytes = "1"
cfb-mode = "0.8"
chacha20poly1305 = "0.10"
getrandom = "0.3"
h2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
md-5 = "0.10"
rustls-pemfile = "2"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
