<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="72" viewBox="0 0 1200 72"
     role="img" aria-labelledby="title desc">
  <title id="title">06 — Дорожная карта, поддержка и правовая информация</title>
  <desc id="desc">Раздел этапов развития ядра F0–F12, перехода на нативный формат конфигурации и условий лицензии.</desc>
  <rect width="1200" height="72" rx="12" fill="#141415"/>
