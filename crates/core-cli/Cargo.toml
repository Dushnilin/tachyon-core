[package]
name = "core-cli"
description = "tachyon-core: sing-box-compatible proxy core optimized for routers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tachyon-core"
path = "src/main.rs"

[features]
# counting allocator + per-second heap dump, see src/allocstat.rs
allocstat = []

[dependencies]
core-config = { path = "../core-config" }
core-runtime = { path = "../core-runtime" }
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

# The router build runs on musl/aarch64 where the system allocator is the
# one thing every packet allocation goes through.
[target.'cfg(all(target_os = "linux", not(target_env = "msvc")))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
