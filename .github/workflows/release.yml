name: Release

# A tag is the only thing that produces a release, and the tag has to be the
# workspace version: `Cargo.toml` is the one place the version lives, so a tag
# that disagrees with it is a release whose binary lies about what it is.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must match Cargo.toml)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SIZE_BUDGET: 12582912

jobs:
  check-version:
    name: tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version the binaries will report
        id: version
        run: |
          in_cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${{ inputs.tag || github.ref_name }}"
          echo "cargo=$in_cargo tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$in_cargo" != "${tag#v}" ]; then
            echo "::error::Cargo.toml says $in_cargo, the release is tagged $tag"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt router musl targets (static binary)
          - name: x86_64
            target: x86_64-unknown-linux-musl
            use_musl_lld: true
            budget: 12582912
          - name: aarch64
            target: aarch64-unknown-linux-musl
            budget: 12582912
          - name: armv7
            target: armv7-unknown-linux-musleabihf
            use_musl_lld: true
            budget: 12582912
          - name: armv6
            target: arm-unknown-linux-musleabi
            use_musl_lld: true
            budget: 12582912
          - name: riscv64
            target: riscv64gc-unknown-linux-musl
            use_musl_lld: true
            budget: 12582912
          # mipsel and mips have no prebuilt std: tier-3 targets that need
          # the standard library built from source via nightly + build-std
          - name: mipsel
            target: mipsel-unknown-linux-musl
            build-std: true
            use_musl_lld: true
            budget: 12582912
          - name: mips
            target: mips-unknown-linux-musl
            build-std: true
            use_musl_lld: true
            budget: 12582912
          # Desktop & Server targets
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            budget: 16777216
          - name: windows-amd64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            is_windows: true
            budget: 20971520
          - name: darwin-amd64
            target: x86_64-apple-darwin
            os: macos-latest
            budget: 16777216
          - name: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            budget: 16777216
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (prebuilt std)
        if: ${{ !matrix.build-std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Toolchain (std from source)
        if: ${{ matrix.build-std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      # Link musl with rust-lld where needed. Skipped for aarch64 because .cargo/config.toml
      # already configures rustflags with ARMv8 assembly features + neon + rust-lld.
      - name: Link musl with rust-lld
        if: ${{ matrix.use_musl_lld }}
        run: echo "RUSTFLAGS=-C linker=rust-lld -C link-self-contained=yes" >> "$GITHUB_ENV"

      # Windows runner uses MSVC's link.exe from PATH
      - name: Windows linker override
        if: ${{ matrix.is_windows }}
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=link.exe" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.build-std }}" ]; then
            cargo build --workspace --release --target ${{ matrix.target }} \
              -Z build-std=std,panic_abort
          else
            cargo build --workspace --release --target ${{ matrix.target }}
          fi

      - name: Size budget
        shell: bash
        run: |
          if [ "${{ matrix.is_windows }}" = "true" ]; then
            bin="target/${{ matrix.target }}/release/tachyon-core.exe"
          else
            bin="target/${{ matrix.target }}/release/tachyon-core"
          fi
          size=$(wc -c < "$bin" | tr -d ' ')
          budget="${{ matrix.budget || env.SIZE_BUDGET }}"
          echo "${{ matrix.name }}: $size bytes, budget $budget"
          test "$size" -le "$budget"

      - name: The binary is for this architecture
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/tachyon-core"

      - name: Pack (Unix)
        if: ${{ !matrix.is_windows }}
        shell: bash
        run: |
          ver="${{ inputs.tag || github.ref_name }}"
          name="tachyon-core-${{ matrix.name }}-${ver}"
          bin="target/${{ matrix.target }}/release/tachyon-core"
          cp "$bin" "./${name}"
          sha256sum "./${name}" > "./${name}.sha256"
          tar -czf "${name}.tar.gz" "./${name}"

      - name: Pack (Windows)
        if: ${{ matrix.is_windows }}
        shell: bash
        run: |
          ver="${{ inputs.tag || github.ref_name }}"
          name="tachyon-core-${{ matrix.name }}-${ver}"
          bin="target/${{ matrix.target }}/release/tachyon-core.exe"
          cp "$bin" "./tachyon-core.exe"
          sha256sum "./tachyon-core.exe" > "./${name}.sha256"
          tar -czf "${name}.tar.gz" "./tachyon-core.exe"
          powershell -Command "Compress-Archive -Path './tachyon-core.exe' -DestinationPath '${name}.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            tachyon-core-${{ matrix.name }}-*.tar.gz
            tachyon-core-${{ matrix.name }}-*.zip
            tachyon-core-${{ matrix.name }}-*.sha256
          if-no-files-found: warn

  release:
    name: attach to the release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: One checksum file for everything
        run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
      - name: The notes for this version, not the whole file
        run: |
          ver="${{ inputs.tag || github.ref_name }}"
          ver="${ver#v}"
          awk -v want="## $ver" '
            /^## / { inside = ($0 == want) }
            inside
          ' CHANGELOG.md > notes.md
          if ! grep -q '^## ' notes.md; then
            echo "::error::CHANGELOG.md has no section for $ver"
            exit 1
          fi
          cat notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false
