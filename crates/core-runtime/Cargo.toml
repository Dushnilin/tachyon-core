[package]
name = "core-runtime"
description = "tachyon-core data plane runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
argon2.workspace = true
core-config = { path = "../core-config" }
core-crypto = { path = "../core-crypto" }
core-experimental = { path = "../core-experimental" }
core-tls = { path = "../core-tls" }
serde_json.workspace = true
anyhow.workspace = true
smoltcp = { workspace = true, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }
x25519-dalek.workspace = true
aes.workspace = true
aes-gcm.workspace = true
base64.workspace = true
blake2.workspace = true
blake3.workspace = true
bytes.workspace = true
cfb-mode.workspace = true
chacha20 = "0.9"
chacha20poly1305.workspace = true
ml-kem.workspace = true
ctr.workspace = true
rand_core.workspace = true
getrandom.workspace = true
h2.workspace = true
h3.workspace = true
h3-quinn.workspace = true
hickory-proto.workspace = true
if-addrs.workspace = true
hkdf.workspace = true
hmac.workspace = true
http.workspace = true
# raw DEFLATE for the external_ui bundle; miniz_oxide keeps it pure Rust
flate2.workspace = true
md-5.workspace = true
quinn.workspace = true
regex.workspace = true
aho-corasick.workspace = true
rustls-pemfile.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
tokio-rustls.workspace = true
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "signal",
    "sync",
    "time",
] }
socket2 = { version = "0.6", features = ["all"] }
blowfish = "0.10"
cast5 = "0.12"
des = "0.9"
ripemd = "0.1"
aria = "0.2"
camellia = "0.2"
sm4 = "0.6"
kisaseed = "0.1.3"
# pure rust: no c toolchain, which the no-c rule and the musl cross build
# both require. Only the block codec is used.
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
# Two `cipher` generations coexist: aes 0.8 / kisaseed use 0.4, while
# aria / camellia / cast5 / des / sm4 use 0.5 (inout API).
cipher = "0.4"
cipher05 = { package = "cipher", version = "0.5" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
