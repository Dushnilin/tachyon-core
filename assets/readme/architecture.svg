<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <title>tachyon-core Architecture &amp; Zero-Copy Pipeline</title>
  <defs>
    <!-- Dark Tech Canvas Gradient -->
    <radialGradient id="arch-bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#090D16" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="card-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="arch-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glowing Filters with userSpaceOnUse -->
    <filter id="neon-green" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-cyan" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-purple" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-amber" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-pink" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Miniature 3D Tachyon Brand Logo Symbol -->
    <g id="tachyon-mini-logo">
      <circle cx="10" cy="10" r="9" fill="#00F0FF" fill-opacity="0.12"/>
      <!-- Left 3D Obsidian Facet -->
      <polygon points="6,3 2,10 6,17 6,10" fill="#1E293B" stroke="#38BDF8" stroke-width="0.6"/>
      <polygon points="6,3 6,10 9,10" fill="#334155" stroke="#00F0FF" stroke-width="0.6"/>
      <polygon points="2,10 6,17 6,10" fill="#0F172A" stroke="#1E293B" stroke-width="0.6"/>
      <polygon points="9,10 6,17 6,10" fill="#0284C7" stroke="#00F0FF" stroke-width="0.6"/>
      <!-- Right 3D Obsidian Facet -->
      <polygon points="14,3 18,10 14,17 14,10" fill="#1E293B" stroke="#818CF8" stroke-width="0.6"/>
      <polygon points="14,3 14,10 11,10" fill="#334155" stroke="#C084FC" stroke-width="0.6"/>
      <polygon points="18,10 14,17 14,10" fill="#0F172A" stroke="#1E293B" stroke-width="0.6"/>
      <polygon points="11,10 14,17 14,10" fill="#7C3AED" stroke="#C084FC" stroke-width="0.6"/>
      <!-- Central Singularity Core -->
      <polygon points="10,6 13,10 10,14 7,10" fill="#00F0FF" stroke="#FFFFFF" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="1.5" fill="#FFFFFF"/>
    </g>
  </defs>

  <style>
    @keyframes flowCyan {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowGreen {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowPurple {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowAmber {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowPink {
      from { stroke-dashoffset: 168; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulseCardBorder {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.95; }
    }

    @keyframes blinkLed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .stream-lan { stroke-dasharray: 14 28; animation: flowCyan 2.2s linear infinite; }
    .stream-direct { stroke-dasharray: 14 28; animation: flowGreen 1.8s linear infinite; }
    .stream-vless { stroke-dasharray: 14 28; animation: flowCyan 1.6s linear infinite; }
    .stream-awg { stroke-dasharray: 14 28; animation: flowPurple 2.0s linear infinite; }
    .stream-heavy { stroke-dasharray: 14 28; animation: flowAmber 2.2s linear infinite; }
    .stream-dns { stroke-dasharray: 14 28; animation: flowPink 2.4s linear infinite; }

    .card-pulse-cyan { animation: pulseCardBorder 3.2s ease-in-out infinite; }
    .card-pulse-purple { animation: pulseCardBorder 2.8s ease-in-out infinite; }
    .card-pulse-green { animation: pulseCardBorder 2.4s ease-in-out infinite; }
    .card-pulse-amber { animation: pulseCardBorder 2.6s ease-in-out infinite; }
    .card-pulse-pink { animation: pulseCardBorder 3.0s ease-in-out infinite; }

    .led-dot { animation: blinkLed 2s ease-in-out infinite; }

    .title-h1 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 20px; fill: url(#arch-title-grad); letter-spacing: 1px; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #94A3B8; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #F8FAFC; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #94A3B8; }
    .tag-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Background Surface -->
  <rect width="1200" height="620" rx="16" fill="url(#arch-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Title Header -->
  <g transform="translate(45, 40)">
    <text class="title-h1">⚡ TACHYON-CORE ZERO-COPY TRAFFIC PIPELINE</text>
    <text y="22" class="title-sub">Асинхронный сетевой конвейер перехвата пакетов ядра Linux и туннелирования</text>
  </g>

  <!-- ================================================================= -->
  <!-- CONNECTING HIGH-SPEED CONDUITS (Strict Center Alignment) -->
  <!-- ================================================================= -->
  <g fill="none" stroke-linecap="round">
    <!-- Inbound: Clients -> Core -->
    <path d="M 225,325 L 350,325" stroke="#1E293B" stroke-width="4"/>
    <path d="M 225,325 L 350,325" stroke="#00F0FF" stroke-width="3.5" class="stream-lan" filter="url(#neon-cyan)"/>

    <!-- Path 1: Direct WAN (Target Center: y=115) -->
    <path d="M 590,270 C 660,270 720,115 780,115 L 890,115" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,270 C 660,270 720,115 780,115 L 890,115" stroke="#10B981" stroke-width="3.5" class="stream-direct" filter="url(#neon-green)"/>

    <!-- Path 2: Post-Quantum VLESS (Target Center: y=215) -->
    <path d="M 590,295 C 660,295 720,215 780,215 L 890,215" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,295 C 660,295 720,215 780,215 L 890,215" stroke="#00F0FF" stroke-width="3.5" class="stream-vless" filter="url(#neon-cyan)"/>

    <!-- Path 3: AmneziaWG 2/3 (Target Center: y=315) -->
    <path d="M 590,325 L 890,315" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,325 L 890,315" stroke="#C084FC" stroke-width="3.5" class="stream-awg" filter="url(#neon-purple)"/>

    <!-- Path 4: XHTTP & Hysteria2 (Target Center: y=415) -->
    <path d="M 590,345 C 660,345 720,415 780,415 L 890,415" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,345 C 660,345 720,415 780,415 L 890,415" stroke="#F59E0B" stroke-width="3.5" class="stream-heavy" filter="url(#neon-amber)"/>

    <!-- Path 5: Smart DNS & FakeIP (Target Center: y=515) -->
    <path d="M 590,370 C 660,370 720,515 780,515 L 890,515" stroke="#1E293B" stroke-width="4"/>
    <path d="M 590,370 C 660,370 720,515 780,515 L 890,515" stroke="#EC4899" stroke-width="3.5" class="stream-dns" filter="url(#neon-pink)"/>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT COLUMN: INBOUNDS -->
  <!-- ================================================================= -->
  <g transform="translate(45, 185)">
    <rect width="180" height="280" rx="12" fill="url(#card-glass)" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(15, 15)">
      <rect width="36" height="36" rx="8" fill="#0284C7" fill-opacity="0.2"/>
      <use href="#tachyon-mini-logo" x="8" y="8"/>
      <text x="46" y="22" class="node-title">Inbounds</text>
      <text x="46" y="34" class="node-sub">Kernel &amp; Server</text>
    </g>

    <!-- Inbound Items -->
    <g transform="translate(15, 68)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12">Linux TProxy</text>
      <text x="10" y="34" class="tag-mono" fill="#38BDF8">IP_TRANSPARENT (v4/v6)</text>
    </g>
    <g transform="translate(15, 118)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12">Redirect (NAT)</text>
      <text x="10" y="34" class="tag-mono" fill="#38BDF8">SO_ORIGINAL_DST</text>
    </g>
    <g transform="translate(15, 168)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12">Mixed SOCKS5 / HTTP</text>
      <text x="10" y="34" class="tag-mono" fill="#38BDF8">CONNECT + 407 + UDP</text>
    </g>
    <g transform="translate(15, 218)">
      <rect width="150" height="42" rx="6" fill="#0B132B" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
      <text x="10" y="20" class="node-title" font-size="12" fill="#38BDF8">Server Inbounds</text>
      <text x="10" y="34" class="tag-mono" fill="#34D399">VLESS · TROJAN · VMESS</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CENTER COLUMN: TACHYON CORE ENGINE -->
  <!-- ================================================================= -->
  <g transform="translate(350, 140)">
    <rect width="240" height="370" rx="14" fill="#090E1A" stroke="#00F0FF" stroke-width="2" class="card-pulse-cyan"/>
    
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="16" fill="#00F0FF" fill-opacity="0.15"/>
      <use href="#tachyon-mini-logo" x="8" y="8"/>
      <text x="44" y="16" class="node-title" fill="#00F0FF">Tachyon Core</text>
      <text x="44" y="30" class="node-sub">Rust Tokio + Zero-Copy</text>
    </g>

    <!-- Sub-Engines in Core -->
    <g transform="translate(18, 70)">
      <!-- 1. Zero-Alloc Router -->
      <g transform="translate(0, 0)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#10B981" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">Zero-Alloc Router</text>
        <text x="26" y="38" class="tag-mono" fill="#34D399">CIDR, SUFFIX, DHCP, SRS v5</text>
      </g>

      <!-- 2. PeekStream Sniffer -->
      <g transform="translate(0, 60)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#38BDF8" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">PeekStream Sniffer</text>
        <text x="26" y="38" class="tag-mono" fill="#38BDF8">TLS SNI, HTTP, QUIC, DNS</text>
      </g>

      <!-- 3. Tokio Splicer -->
      <g transform="translate(0, 120)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#A855F7" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">Tokio Splicer</text>
        <text x="26" y="38" class="tag-mono" fill="#C084FC">ZERO-COPY PIPE &amp; NETNS</text>
      </g>

      <!-- 4. RustCrypto Provider -->
      <g transform="translate(0, 180)">
        <rect width="204" height="52" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="14" cy="26" r="4" fill="#F59E0B" class="led-dot"/>
        <text x="26" y="22" class="node-title" font-size="12">RustCrypto Provider</text>
        <text x="26" y="38" class="tag-mono" fill="#FBBF24">PURE RUST (NO RING/CGO)</text>
      </g>

      <!-- 5. Clash API & bbolt DB -->
      <g transform="translate(0, 240)">
        <rect width="204" height="42" rx="8" fill="#1E1B4B" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="14" cy="21" r="4" fill="#EC4899" class="led-dot"/>
        <text x="26" y="20" class="node-title" font-size="11" fill="#F472B6">Clash API &amp; bbolt DB</text>
        <text x="26" y="34" class="tag-mono" fill="#EC4899">REST UI · CACHE.DB BBOLT</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT COLUMN: 5 DESTINATIONS (Aligned Centers at y=115, 215, 315, 415, 515) -->
  <!-- ================================================================= -->

  <!-- DESTINATION 1: DIRECT WAN (GREEN) y=75..155, center=115 -->
  <g transform="translate(890, 75)">
    <rect width="265" height="80" rx="10" fill="url(#card-glass)" stroke="#10B981" stroke-width="1.5" class="card-pulse-green"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#10B981" fill-opacity="0.15"/>
      <use href="#tachyon-mini-logo" x="6" y="6"/>
      <text x="38" y="16" class="node-title" fill="#34D399">Direct WAN</text>
      <text x="38" y="30" class="tag-mono" fill="#10B981">0 ms OVERHEAD · DOMESTIC HOSTS</text>
    </g>
    <text x="16" y="62" class="node-sub">Прямой транзит без проксирования</text>
  </g>

  <!-- DESTINATION 2: POST-QUANTUM VLESS (CYAN) y=175..255, center=215 -->
  <g transform="translate(890, 175)">
    <rect width="265" height="80" rx="10" fill="url(#card-glass)" stroke="#00F0FF" stroke-width="1.5" class="card-pulse-cyan"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#00F0FF" fill-opacity="0.15"/>
      <use href="#tachyon-mini-logo" x="6" y="6"/>
      <text x="38" y="16" class="node-title" fill="#00F0FF">VLESS Post-Quantum</text>
      <text x="38" y="30" class="tag-mono" fill="#38BDF8">ML-KEM-768 · UTLS · REALITY</text>
    </g>
    <text x="16" y="62" class="node-sub">Квантовая защита + фрагментация SNI</text>
  </g>

  <!-- DESTINATION 3: AMNEZIAWG 2.0 / 3.x (PURPLE) y=275..355, center=315 -->
  <g transform="translate(890, 275)">
    <rect width="265" height="80" rx="10" fill="url(#card-glass)" stroke="#8B5CF6" stroke-width="1.5" class="card-pulse-purple"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#8B5CF6" fill-opacity="0.15"/>
      <use href="#tachyon-mini-logo" x="6" y="6"/>
      <text x="38" y="16" class="node-title" fill="#C084FC">AmneziaWG 2.0 / 3.x</text>
      <text x="38" y="30" class="tag-mono" fill="#C084FC">JUNK HEADERS · DPI MASQUERADE</text>
    </g>
    <text x="16" y="62" class="node-sub">jc/jmin/jmax + DNS/STUN/QUIC decoys</text>
  </g>

  <!-- DESTINATION 4: XHTTP & HYSTERIA2 (AMBER) y=375..455, center=415 -->
  <g transform="translate(890, 375)">
    <rect width="265" height="80" rx="10" fill="url(#card-glass)" stroke="#F59E0B" stroke-width="1.5" class="card-pulse-amber"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#F59E0B" fill-opacity="0.15"/>
      <use href="#tachyon-mini-logo" x="6" y="6"/>
      <text x="38" y="16" class="node-title" fill="#FBBF24">XHTTP · TUIC · Hy2</text>
      <text x="38" y="30" class="tag-mono" fill="#F59E0B">HTTP/1.1 XMUX · QUIC V5</text>
    </g>
    <text x="16" y="62" class="node-sub">Xray 26.9 interop · Quinn · Naive · Snell</text>
  </g>

  <!-- DESTINATION 5: SMART DNS & FAKEIP (PINK) y=475..555, center=515 -->
  <g transform="translate(890, 475)">
    <rect width="265" height="80" rx="10" fill="url(#card-glass)" stroke="#EC4899" stroke-width="1.5" class="card-pulse-pink"/>
    <g transform="translate(14, 14)">
      <circle cx="16" cy="16" r="14" fill="#EC4899" fill-opacity="0.15"/>
      <use href="#tachyon-mini-logo" x="6" y="6"/>
      <text x="38" y="16" class="node-title" fill="#F472B6">Smart DNS &amp; FakeIP</text>
      <text x="38" y="30" class="tag-mono" fill="#EC4899">198.18.0.0/15 · DOH / DOT</text>
    </g>
    <text x="16" y="62" class="node-sub">Кэш ответов LRU, защита от перехвата</text>
  </g>
</svg>
